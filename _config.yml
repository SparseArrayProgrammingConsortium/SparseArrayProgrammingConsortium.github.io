# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Sparse Array Programming Consortium
description: Coordinating organization for sparse array programming projects, tools, standards, and benchmarks.
baseurl:
url: https://sparsearrayprogrammingconsortium.github.io
permalink: /:categories/:title

content_type: Sparse Array Programming Consortium
use_authors: true # Set this to false to disable showing post authors

brand_logo: icon.png
brand_name: Sparse Array Programming Consortium
header: Sparse Array Programming Consortium
subheader: Coordinating sparse array programming, interchange, APIs, and benchmarks.

meta_image: icon.png

# Social Links
twitter_username:
facebook_page:
github_username: SparseArrayProgrammingConsortium
email:
linkedin_page:
instagram_username: 

# Navivation
nav_item_one: Projects
nav_item_one_link: "#projects"

nav_item_two: People
nav_item_two_link: "#people"

nav_item_three:
nav_item_three_link:

nav_button: GitHub
nav_button_link: https://github.com/SparseArrayProgrammingConsortium

# Build settings
theme: minima
plugins:
  - jekyll-feed

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.

sass:
  sass_dir:          _scss
  style:            :compressed
